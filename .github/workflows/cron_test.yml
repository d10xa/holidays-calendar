name: cron_test

on:
    schedule:
        -   cron: '0 0 * * 0' # “At 00:00 on Sunday.”

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 17
            -   uses: gradle/actions/setup-gradle@v6
            -   run: ./gradlew clean cleanTest test
